name: Deploy Docs to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Standard runner for manual recovery
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-data-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test website, downloads, and review moderation
        run: |
          node --test scripts/test-download-stats.mjs scripts/test-downloads.mjs scripts/test-reviews.mjs scripts/test-review-data.mjs scripts/test-reviews-sync.mjs scripts/test-reviews-feed.mjs
          node --test scripts/test-analytics.mjs
          python3 scripts/test-reviews-import.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages

  deploy:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
