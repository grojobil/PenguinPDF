name: Refresh download statistics

on:
  schedule:
    - cron: '23 */6 * * *'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test statistics and download routing
        run: node --test scripts/test-download-stats.mjs scripts/test-downloads.mjs
      - name: Read public installer download counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-download-stats.mjs
      - name: Save observed counts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/downloads.json
          git commit -m 'Update recorded installer download totals'
          git push origin HEAD:main
      - name: Refresh the published Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
